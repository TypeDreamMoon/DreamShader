; DreamShader's own translations, kept with DreamLoc: the editor's menus, commands, notifications and the
; compiler's diagnostics. `dloc gather -Plugin DreamShader` brings DLoc/<culture>/ up to date with the source;
; `dloc bake -Plugin DreamShader` writes Content/Localization/DreamShader*, which the editor reads with or
; without DreamLoc in the project.
[DreamLoc]
SourceCulture=en
TargetCultures=zh-Hans

[Gather]
ExcludePaths=Content/Localization/*, Content/Developers/*
EditorOnlyData=true
MetaData=true

[Publish]
LoadingPolicy=Editor