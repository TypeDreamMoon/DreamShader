<path class="head" d="M190,503 L193.575,496.5 L186.425,496.5 Z"/>
<text x="200" y="484" font-size="12" class="muted">编辑</text>
<path class="wire" d="M600,456 L600,498.45"/>
<path class="head" d="M600,503 L603.575,496.5 L596.425,496.5 Z"/>
<text x="610" y="484" font-size="12" class="muted">监视 · 生成</text>
<path class="wire" d="M1010,456 L1010,498.45"/>
<path class="head" d="M1010,503 L1013.58,496.5 L1006.42,496.5 Z"/>
<text x="1020" y="484" font-size="12" class="muted">生成</text>
</svg>
