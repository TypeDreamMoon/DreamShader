<text x="756" y="417" font-size="13" class="mono" xml:space="preserve"><tspan class="kw">#pragma </tspan>instance(Parent = <tspan class="st">"/Game/M_Panel"</tspan>)</text>
<rect x="1107.16" y="401" width="42.84" height="22" rx="11" class="chip"/>
<text x="1128.58" y="415.96" font-size="11" class="muted mono" text-anchor="middle">.dsi</text>
<path class="w-teal" d="M738,412 L717.55,412"/>
<path class="h-teal" d="M713,412 L719.5,415.575 L719.5,408.425 Z"/>
