<text x="756" y="321" font-size="13" class="mono" xml:space="preserve"><tspan class="dc">/// @layer  </tspan><tspan class="kw">export void </tspan>L(<tspan class="kw">inout </tspan><tspan class="ty">material</tspan> m)</text>
<path class="w-teal" d="M738,316 L717.55,316"/>
<path class="h-teal" d="M713,316 L719.5,319.575 L719.5,312.425 Z"/>
