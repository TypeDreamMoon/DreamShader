<text x="756" y="273" font-size="13" class="mono" xml:space="preserve"><tspan class="kw">export </tspan><tspan class="ty">float3</tspan> F(<tspan class="ty">float2</tspan> UV) { … }</text>
<path class="w-teal" d="M738,268 L717.55,268"/>
<path class="h-teal" d="M713,268 L719.5,271.575 L719.5,264.425 Z"/>
