<text x="756" y="225" font-size="13" class="mono" xml:space="preserve"><tspan class="kw">export void </tspan>M(<tspan class="kw">inout </tspan><tspan class="ty">material</tspan> m)</text>
<path class="w-teal" d="M738,220 L717.55,220"/>
<path class="h-teal" d="M713,220 L719.5,223.575 L719.5,216.425 Z"/>
