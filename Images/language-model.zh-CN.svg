<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="866" viewBox="0 0 1200 866" role="img" aria-labelledby="t d">
<title id="t">两种写法，同一个编译器</title>
<desc id="d">对照表：每个 1.x DreamShaderLang 块、它的 2.0 写法，以及两者生成的 Unreal 资源或图元素。</desc>
<style>
:root{--bg:#ffffff;--panel:#f6f8fa;--chip:#eaeef2;--line:#d0d7de;--text:#1f2328;--muted:#59636e;
--teal:#0b7f72;--violet:#6e44d8;--blue:#0a64c8;--amber:#a95a00}
@media (prefers-color-scheme:dark){:root{--bg:#0d1117;--panel:#161b22;--chip:#222a35;--line:#30363d;
--text:#e6edf3;--muted:#8d96a0;--teal:#2dd4bf;--violet:#a78bfa;--blue:#58a6ff;--amber:#f2a93b}}
text{font-family:'Segoe UI', -apple-system, BlinkMacSystemFont, 'Helvetica Neue', Arial, 'PingFang SC', 'Microsoft YaHei', 'Noto Sans CJK SC', sans-serif;fill:var(--text)}
.mono{font-family:ui-monospace, 'Cascadia Code', SFMono-Regular, Consolas, Menlo, 'Liberation Mono', monospace}
.muted{fill:var(--muted)}
.b{font-weight:600}
.frame{fill:var(--bg);stroke:var(--line)}
.panel{fill:var(--panel);stroke:var(--line)}
.chip{fill:var(--chip)}
.rule{stroke:var(--line);fill:none}
.wire{stroke:var(--muted);fill:none;stroke-width:1.5}
.head{fill:var(--muted)}
.dash{stroke-dasharray:5 4}
.ink{fill:var(--bg)}
.cm{fill:var(--muted)}
.f-teal{fill:var(--teal)}.s-teal{stroke:var(--teal);fill:none;stroke-width:1.5}.tint-teal{fill:var(--teal);fill-opacity:.11;stroke:var(--teal);stroke-opacity:.55}.w-teal{stroke:var(--teal);fill:none;stroke-width:1.5}.h-teal{fill:var(--teal)}
.f-violet{fill:var(--violet)}.s-violet{stroke:var(--violet);fill:none;stroke-width:1.5}.tint-violet{fill:var(--violet);fill-opacity:.11;stroke:var(--violet);stroke-opacity:.55}.w-violet{stroke:var(--violet);fill:none;stroke-width:1.5}.h-violet{fill:var(--violet)}
.f-blue{fill:var(--blue)}.s-blue{stroke:var(--blue);fill:none;stroke-width:1.5}.tint-blue{fill:var(--blue);fill-opacity:.11;stroke:var(--blue);stroke-opacity:.55}.w-blue{stroke:var(--blue);fill:none;stroke-width:1.5}.h-blue{fill:var(--blue)}
.f-amber{fill:var(--amber)}.s-amber{stroke:var(--amber);fill:none;stroke-width:1.5}.tint-amber{fill:var(--amber);fill-opacity:.11;stroke:var(--amber);stroke-opacity:.55}.w-amber{stroke:var(--amber);fill:none;stroke-width:1.5}.h-amber{fill:var(--amber)}
.kw{fill:var(--violet)}.ty{fill:var(--teal)}.st{fill:var(--amber)}.dc{fill:var(--muted)}
</style>
<rect x="0.5" y="0.5" width="1199" height="865" rx="16" class="frame"/>
<text x="40" y="58" font-size="26" class="b">两种写法，同一个编译器</text>
<text x="40" y="88" font-size="15" class="muted">每个 1.x 块都有一个生成同样结果的 2.0 写法，2.0 还多了材质实例和 Custom Pass 管线。两个前端接入同一条流水线，检查完全一样。</text>
<rect x="40" y="134" width="145.68" height="26" rx="13" class="tint-violet"/>
<text x="112.84" y="151.68" font-size="13" class="b" text-anchor="middle">1.x  ·  .dsm .dsf .dsh</text>
<rect x="1019" y="134" width="141" height="26" rx="13" class="tint-teal"/>
<text x="1089.5" y="151.68" font-size="13" class="b" text-anchor="middle">2.0  ·  .dss .dsi .dsp</text>
<text x="600" y="152" font-size="13" class="muted" text-anchor="middle">生成</text>
<text x="40" y="188" font-size="12" class="b muted">生成的资源</text>
<rect x="40" y="200" width="420" height="40" rx="8" class="panel"/>
<text x="56" y="225" font-size="13" class="mono" xml:space="preserve"><tspan class="kw">Shader</tspan>(Name = <tspan class="st">"…"</tspan>) { … }</text>
