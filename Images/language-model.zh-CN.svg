<text x="756" y="369" font-size="13" class="mono" xml:space="preserve"><tspan class="dc">/// @layerblend  </tspan><tspan class="kw">export void </tspan>B(…)</text>
<path class="w-teal" d="M738,364 L717.55,364"/>
<path class="h-teal" d="M713,364 L719.5,367.575 L719.5,360.425 Z"/>
<rect x="40" y="392" width="420" height="40" rx="8" class="rule dash"/>
<text x="56" y="417" font-size="13" class="muted">1.x 没有对应写法</text>
<rect x="490" y="392" width="220" height="40" rx="20" class="tint-blue"/>
<text x="600" y="417" font-size="13.5" class="b" text-anchor="middle">材质实例</text>
