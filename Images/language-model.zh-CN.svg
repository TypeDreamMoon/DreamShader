<text x="756" y="465" font-size="13" class="mono" xml:space="preserve"><tspan class="kw">#pragma </tspan>pipeline  <tspan class="kw">buffer</tspan> …  <tspan class="kw">pass</tspan> …</text>
<rect x="1046.77" y="449" width="103.23" height="22" rx="11" class="chip"/>
<text x="1098.38" y="463.96" font-size="11" class="muted mono" text-anchor="middle">.dsp · UE 5.8</text>
<path class="w-teal" d="M738,460 L717.55,460"/>
<path class="h-teal" d="M713,460 L719.5,463.575 L719.5,456.425 Z"/>
<text x="40" y="502" font-size="12" class="b muted">图内部</text>
<rect x="40" y="514" width="420" height="40" rx="8" class="panel"/>
<text x="56" y="539" font-size="13" class="mono" xml:space="preserve"><tspan class="kw">Properties</tspan> = { <tspan class="ty">float4</tspan> Tint = …; }</text>
<path class="w-violet" d="M462,534 L482.45,534"/>
