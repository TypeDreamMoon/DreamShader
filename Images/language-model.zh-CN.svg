<rect x="740" y="514" width="420" height="40" rx="8" class="panel"/>
<text x="756" y="539" font-size="13" class="mono" xml:space="preserve"><tspan class="dc">/// @group Look  </tspan><tspan class="kw">uniform </tspan><tspan class="ty">float4</tspan> Tint = …;</text>
<path class="w-teal" d="M738,534 L717.55,534"/>
<path class="h-teal" d="M713,534 L719.5,537.575 L719.5,530.425 Z"/>
