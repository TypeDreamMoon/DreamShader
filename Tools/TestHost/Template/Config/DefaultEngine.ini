; DreamShader test host -- engine config.
;
; This host stands in for DevProject, the project DreamShader is developed in. Values taken from
; DevProject's Config/DefaultEngine.ini are copied verbatim, because several of them feed the shader cache
; keys: a host that agrees with DevProject on them reads DevProject's already-warm derived data cache
; instead of compiling every shader again on its first launch.
;
; There is deliberately no derived-data-cache section. On this engine the cache that is actually read and
; written is the local Zen store, which is machine-wide rather than per project ([Zen.AutoLaunch] DataPath
; and the ue.ddc namespace in BaseEngine.ini); leaving the cache graph alone is exactly what makes this host
; share DevProject's cache.

[/Script/EngineSettings.GameMapsSettings]
; The lightest map the engine ships that still gives the editor a level to render: one PlayerStart. The
; Custom Pass render tests build their own world; they only need the editor to have one.
EditorStartupMap=/Engine/Maps/Entry.Entry
GameDefaultMap=/Engine/Maps/Entry.Entry

[/Script/Engine.RendererSettings]
; Copied verbatim from DevProject. These feed the shader map keys; one value different here and the first
; launch compiles its shaders from nothing. Substrate is on in DevProject, so the Custom Pass material and
; mesh passes are exercised under Substrate here too.
;
; r.CustomDepth is NOT set to 3 here although the stencil-filtered mesh pass tests need stencil values:
; DevProject does not set it, and the tests that need it set the console variable for themselves.
r.AllowStaticLighting=False
r.Shadow.Virtual.Enable=1
r.GenerateMeshDistanceFields=True
r.DynamicGlobalIlluminationMethod=1
r.ReflectionMethod=1
r.SkinCache.CompileShaders=True
r.RayTracing=True
r.RayTracing.RayTracingProxies.ProjectEnabled=True
r.Substrate=True
r.Substrate.ProjectGBufferFormat=0
r.DefaultFeature.AutoExposure.ExtendDefaultLuminanceRange=True
r.DefaultFeature.LocalExposure.HighlightContrastScale=0.8
r.DefaultFeature.LocalExposure.ShadowContrastScale=0.8

[/Script/WindowsTargetPlatform.WindowsTargetSettings]
; Copied from DevProject: the RHI and the targeted shader formats decide which shader platform the editor
; compiles for, and the platform is part of every shader cache key.
DefaultGraphicsRHI=DefaultGraphicsRHI_DX12
-D3D12TargetedShaderFormats=PCD3D_SM5
+D3D12TargetedShaderFormats=PCD3D_SM6
-D3D11TargetedShaderFormats=PCD3D_SM5
+D3D11TargetedShaderFormats=PCD3D_SM5

[/Script/LinuxTargetPlatform.LinuxTargetSettings]
-TargetedRHIs=SF_VULKAN_SM5
+TargetedRHIs=SF_VULKAN_SM6

[/Script/MacTargetPlatform.MacTargetSettings]
-TargetedRHIs=SF_METAL_SM5
+TargetedRHIs=SF_METAL_SM6

[/Script/HardwareTargeting.HardwareTargetingSettings]
TargetedHardwareClass=Desktop
AppliedTargetedHardwareClass=Desktop
DefaultGraphicsPerformance=Maximum
AppliedDefaultGraphicsPerformance=Maximum

[/Script/Engine.UserInterfaceSettings]
; Copied from DevProject, where the New Project wizard wrote it.
bAuthorizeAutomaticWidgetVariableCreation=False
FontDPIPreset=Standard
FontDPI=72

[/Script/DreamShaderPass.DreamPassSettings]
; The pass layers of the Custom Pass demo (Tools/TestHost/PassDemo): CP_Highlight selects Highlight, CP_XRay XRay.
; The tests that need layers set their own and put these back.
+LayerNames=Highlight
+LayerNames=XRay
